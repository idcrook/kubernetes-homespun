---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: https-birdnetpi-http

spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`birdnetpi.idcrook.dev`)
      services:
        - name: birdnetpi-http
          port: 80
      # middlewares:
      #   - name: my-fail2ban
  tls: {}
  # tls:
  #   certResolver: myresolver
  # tls:
  #   certResolver: wildcardresolver
  #   domains:
  #     - main: idcrook.dev
  #       sans:
  #         -  "*.idcrook.dev"

---
kind: Service
apiVersion: v1
metadata:
  name: "birdnetpi-http"
spec:
  type: ClusterIP
  ports:
    - protocol: "TCP"
      port: 80
      targetPort: 80
      name: "birdnetpi"
